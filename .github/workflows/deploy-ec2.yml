name: Deploy EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      APP_PORT: ${{ secrets.APP_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests before deploy
        run: npm test

      - name: Create deploy package
        run: tar -czf app.tar.gz package.json package-lock.json src README.md

      - name: Configure SSH
        run: |
          set -euo pipefail

          : "${EC2_HOST:?Configure the EC2_HOST secret}"
          : "${EC2_SSH_KEY:?Configure the EC2_SSH_KEY secret}"
          EC2_USER="${EC2_USER:-ec2-user}"
          echo "EC2_USER=$EC2_USER" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Send files to EC2
        run: |
          set -euo pipefail

          APP_DIR="${EC2_APP_DIR:-/home/$EC2_USER/devops-ads}"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p '$APP_DIR'"
          scp -i ~/.ssh/ec2_key app.tar.gz "$EC2_USER@$EC2_HOST:/tmp/devops-ads-app.tar.gz"

      - name: Restart application on EC2
        run: |
          set -euo pipefail

          APP_DIR="${EC2_APP_DIR:-/home/$EC2_USER/devops-ads}"
          PORT="${APP_PORT:-3000}"

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "APP_DIR='$APP_DIR' PORT='$PORT' bash -s" <<'REMOTE'
            set -euo pipefail

            install_node() {
              if command -v npm >/dev/null 2>&1; then
                return
              fi

              if command -v apt-get >/dev/null 2>&1; then
                curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
                sudo apt-get install -y nodejs
                return
              fi

              if command -v dnf >/dev/null 2>&1; then
                curl -fsSL https://rpm.nodesource.com/setup_22.x | sudo bash -
                sudo dnf install -y nodejs
                return
              fi

              if command -v yum >/dev/null 2>&1; then
                curl -fsSL https://rpm.nodesource.com/setup_22.x | sudo bash -
                sudo yum install -y nodejs
                return
              fi

              echo "Nao foi possivel instalar Node.js automaticamente."
              exit 1
            }

            install_node
            tar -xzf /tmp/devops-ads-app.tar.gz -C "$APP_DIR"
            cd "$APP_DIR"
            npm ci --omit=dev

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            if pm2 describe devops-ads >/dev/null 2>&1; then
              PORT="$PORT" pm2 restart devops-ads --update-env
            else
              PORT="$PORT" pm2 start src/server.js --name devops-ads --update-env
            fi

            pm2 save
          REMOTE
