name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static code analysis
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage
        run: npm run coverage

  delivery:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare delivery package
        run: |
          mkdir delivery
          cp package.json package-lock.json delivery/
          cp -R src delivery/src
          cp README.md delivery/

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-ads-app
          path: delivery
